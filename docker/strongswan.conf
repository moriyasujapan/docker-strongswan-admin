charon-systemd {
  load_modular = yes
  filelog {
    stderr {
      path = /dev/stderr
      default = 1
      ike = 2
      cfg = 1
      time_format = %b %e %T
    }
  }
  journal { default = -1 }
  plugins {
    include strongswan.d/charon/*.conf
    vici { socket = unix:///run/vici/charon.vici }
  }
}

swanctl { socket = unix:///run/vici/charon.vici }
